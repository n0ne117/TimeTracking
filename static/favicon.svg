<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- Clock face -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
  <!-- Hour markers -->
  <line x1="32" y1="12" x2="32" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="32" y2="52" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="16" y2="32" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="32" x2="52" y2="32" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Hour hand pointing to ~10 -->
  <line x1="32" y1="32" x2="22" y2="22" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand pointing to ~2 -->
  <line x1="32" y1="32" x2="40" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="2.5" fill="white"/>
</svg>
